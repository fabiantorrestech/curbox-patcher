name: Build patched Curbox

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Curbox release to patch (7 or later), or "latest"'
        required: true
        default: latest
      force:
        description: Rebuild even if this release was already built with the current patches
        type: boolean
        default: false
  schedule:
    # Daily check (09:00 UTC). Builds only for a new upstream release or a changed patch set.
    - cron: '0 9 * * *'

permissions:
  contents: write

concurrency:
  group: build-patched-curbox
  cancel-in-progress: false

env:
  UPSTREAM: curbox-app/curbox-android
  # The patches are made against Curbox 7; the 6 builds stay under Releases.
  MIN_RELEASE: 7
  HUB: fabiantorrestech/android-apps
  HUB_KEY: PERSONAL
  # The hub's rolling release, and the title prefix that records which build it holds.
  HUB_RELEASE: curbox
  HUB_NAME: Curbox (grayscale patch)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          # Full history: the patch set number counts the commits that changed patches/.
          fetch-depth: 0

      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          HUB_TOKEN: ${{ secrets.APP_HUB_TOKEN }}
          INPUT_RELEASE: ${{ github.event.inputs.release || 'latest' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -euo pipefail
          LATEST="$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)"
          if [ "$INPUT_RELEASE" = "latest" ]; then
            TAG="$LATEST"
          else
            TAG="$INPUT_RELEASE"
          fi

          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::'$TAG' is not a valid release name."
            exit 1
          fi
          if [[ "$TAG" =~ ^[0-9]+$ ]] && [ "$TAG" -lt "$MIN_RELEASE" ]; then
            echo "::error::The patch supports Curbox $MIN_RELEASE and later (asked for $TAG)."
            exit 1
          fi
          if ! gh release view "$TAG" -R "$UPSTREAM" > /dev/null 2>&1; then
            echo "::error::Curbox has no release '$TAG'. See https://github.com/$UPSTREAM/releases"
            exit 1
          fi

          # A new patch set gets its own release tag, so Obtainium sees it as a new version
          # (it compares tags, and a re-published tag looks unchanged). The number counts the
          # commits on main that changed patches/, so it only grows when built from main's full,
          # never rewritten history. Anything else could reuse a number and skip new patches.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are built only from main (this run is on $GITHUB_REF). Run the workflow on main."
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then
            echo "::error::The checkout is shallow, so the patch set number would be wrong."
            exit 1
          fi
          PATCH_SET="$(git rev-list --count HEAD -- patches/)"
          OUT="${TAG}-grayscale-p${PATCH_SET}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          echo "patch_set=$PATCH_SET" >> "$GITHUB_OUTPUT"
          # A build is the newest one (Latest here, a full release, and sent to the hub) unless
          # this repo already has a full release for a newer Curbox, so a rebuild of an older
          # Curbox never replaces a newer build in update apps. (Curbox 6 can no longer be
          # rebuilt at all: MIN_RELEASE is 7 and the patches are made against 7.)
          # The listing runs on its own so a failing gh call stops the step instead of
          # silently counting as "nothing newer".
          OWN_RELEASES="$(gh release list -R "$GITHUB_REPOSITORY" --limit 1000 \
            --json tagName,isPrerelease,isDraft \
            -q '.[] | select((.isPrerelease or .isDraft) | not) | .tagName')"
          NEWEST_BUILT="$(printf '%s\n' "$OWN_RELEASES" | grep -- '-grayscale' \
            | sed 's/-grayscale.*//' | sort -V | tail -1 || true)"
          if [ -n "$NEWEST_BUILT" ] && [ "$NEWEST_BUILT" != "$TAG" ] &&
            [ "$(printf '%s\n%s\n' "$TAG" "$NEWEST_BUILT" | sort -V | tail -1)" = "$NEWEST_BUILT" ]; then
            LATEST_BUILD=false
          else
            LATEST_BUILD=true
          fi
          echo "latest=$LATEST_BUILD" >> "$GITHUB_OUTPUT"

          if gh release view "$OUT" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [ "$INPUT_FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release **$OUT** already exists (Curbox $TAG, patch set $PATCH_SET). No build needed (run with *force* to rebuild it in place)." >> "$GITHUB_STEP_SUMMARY"
            SKIP=true
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            SKIP=false
            if [ "$LATEST_BUILD" = "false" ]; then
              echo "Curbox $NEWEST_BUILT already has a full release here, so this build of $TAG is published as a pre-release and not sent to the app hub." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

          # The hub is updated for every new Latest build, and also when an earlier run published
          # this release but failed to update the hub (for example with an expired token). The
          # hub release's title names the build it holds; when it doesn't name this one, the
          # already published APK is copied to the hub without building again.
          HUB_UPDATE=false
          if [ "$LATEST_BUILD" = "true" ]; then
            if [ "$SKIP" = "false" ]; then
              HUB_UPDATE=true
            else
              if HUB_TITLE="$(GH_TOKEN="$HUB_TOKEN" gh release view "$HUB_RELEASE" -R "$HUB" --json name -q .name 2>/dev/null)"; then
                if [ "$HUB_TITLE" != "$HUB_NAME $OUT" ]; then
                  HUB_UPDATE=true
                  echo "The app hub holds \"$HUB_TITLE\", not $OUT, so this run copies $OUT to the hub." >> "$GITHUB_STEP_SUMMARY"
                fi
              else
                HUB_UPDATE=true
                echo "Couldn't read the app hub (token missing or invalid, or no \`$HUB_RELEASE\` release there yet), so this run tries to copy $OUT to the hub." >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          fi
          echo "hub=$HUB_UPDATE" >> "$GITHUB_OUTPUT"

      # Fail before building, not after publishing, when the hub can't be updated.
      - name: Check app hub token
        if: steps.rel.outputs.hub == 'true'
        env:
          HUB_TOKEN: ${{ secrets.APP_HUB_TOKEN }}
        run: |
          if [ -z "$HUB_TOKEN" ]; then
            echo "::error::The APP_HUB_TOKEN secret is missing, so the app hub can't be updated. Set it (see README, Signing) and run again."
            exit 1
          fi
          # Catches an expired or revoked token. Write access itself is only proven by the
          # upload; if that fails, the next run sees the stale hub and retries without rebuilding.
          if ! GH_TOKEN="$HUB_TOKEN" gh api "repos/$HUB" --silent; then
            echo "::error::APP_HUB_TOKEN can't read $HUB (expired, revoked or wrong). Replace it (see README, Signing) and run again."
            exit 1
          fi

      - name: Clone Curbox ${{ steps.rel.outputs.tag }}
        if: steps.rel.outputs.skip == 'false'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # Full history so `git am -3` can find the blobs the patch was made against.
          git clone --quiet "https://github.com/$UPSTREAM.git" curbox
          git -C curbox checkout --quiet "refs/tags/$TAG"

      - name: Apply patches
        if: steps.rel.outputs.skip == 'false'
        working-directory: curbox
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "curbox-patcher builder"
          git config user.email "actions@users.noreply.github.com"
          # Every patches/*.patch, in name order. Each one is its own commit, so one failing
          # patch names itself in the summary.
          for patch in ../patches/*.patch; do
            name="$(basename "$patch" .patch)"
            if ! git am -3 "$patch"; then
              {
                echo "### The $name patch no longer applies to Curbox $TAG"
                echo "Conflicting files:"
                git diff --name-only --diff-filter=U | sed 's/^/- /'
                echo ""
                echo "Fix: run \`scripts/refresh-patch.sh <curbox-android> $TAG $name\` locally (see README), push, then run this workflow again."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::The $name patch conflicts with Curbox $TAG. See the job summary."
              exit 1
            fi
          done

      - name: Set up JDK 21
        if: steps.rel.outputs.skip == 'false'
        uses: actions/setup-java@v4.2.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        if: steps.rel.outputs.skip == 'false'
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools build-tools;29.0.3'

      # Since Curbox 7 the fdroid unit tests compile, so the tests run on the flavor we ship.
      - name: Run grayscale tests
        if: steps.rel.outputs.skip == 'false'
        working-directory: curbox
        run: |
          chmod +x gradlew
          ./gradlew testFdroidDebugUnitTest --tests "*GrayscaleOwnership*"

      - name: Build fdroid release APK
        if: steps.rel.outputs.skip == 'false'
        working-directory: curbox
        run: ./gradlew assembleFdroidRelease

      - name: Sign APK
        if: steps.rel.outputs.skip == 'false'
        uses: r0adkll/sign-android-release@v1
        id: sign
        with:
          releaseDirectory: curbox/app/build/outputs/apk/fdroid/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # Refuse to publish an APK signed with anything but the PERSONAL key the app hub expects,
      # so a wrong secret can never ship an APK that won't install over the last one.
      - name: Check signing key
        if: steps.rel.outputs.skip == 'false'
        env:
          SIGNED: ${{ steps.sign.outputs.signedReleaseFile }}
        run: |
          set -euo pipefail
          expected="$(curl -fsSL "https://raw.githubusercontent.com/$HUB/main/apps.json" | jq -r ".keys.$HUB_KEY")"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          actual="$("$apksigner" verify --print-certs "$SIGNED" | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)"
          if [ -z "$expected" ] || [ "$expected" = "null" ] || [ "$actual" != "$expected" ]; then
            echo "::error::APK signer $actual does not match $HUB_KEY in $HUB/apps.json ($expected)."
            exit 1
          fi
          echo "Signed with $HUB_KEY ($actual)"

      - name: Prepare release
        if: steps.rel.outputs.skip == 'false'
        id: apk
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          OUT: ${{ steps.rel.outputs.out }}
          PATCH_SET: ${{ steps.rel.outputs.patch_set }}
          SIGNED: ${{ steps.sign.outputs.signedReleaseFile }}
        run: |
          DEST="curbox-${OUT}-fdroid.apk"
          cp "$SIGNED" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

          VERSION_CODE="$(grep -m1 -E '^[[:space:]]*versionCode[[:space:]]*=' curbox/app/build.gradle.kts | tr -dc '0-9')"
          CHANGELOG="curbox/fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
          {
            echo "Curbox $TAG (fdroid) with three patches (patch set $PATCH_SET):"
            echo ""
            echo "- Grayscale: Curbox only switches off a grayscale filter it switched on itself, so other"
            echo "  apps (e.g. GrayScaler+) keep control."
            echo "- Firefox: a link opened in Firefox from another app is checked against keyword groups"
            echo "  right away, not only after the first tap on the page."
            echo "- Unlock waits: after each app group unlock, the next one waits longer (1, 2, 3 minutes"
            echo "  and so on), starting over at your day end. Optional emergency password."
            echo ""
            echo "Upstream: https://github.com/$UPSTREAM/releases/tag/$TAG"
            echo ""
            echo "---"
            echo ""
            if [ -s "$CHANGELOG" ]; then cat "$CHANGELOG"; fi
          } > release-notes.md

      - name: Publish release
        if: steps.rel.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.out }}
          name: Curbox ${{ steps.rel.outputs.out }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.path }}
          make_latest: ${{ steps.rel.outputs.latest }}
          # A build of an older Curbox than one already released here is newer by date. Marking it
          # a pre-release keeps Obtainium (which skips pre-releases by default) from offering it.
          prerelease: ${{ steps.rel.outputs.latest != 'true' }}

      # Only for a hub retry: the release exists, so take its APK instead of building again.
      - name: Download the published APK
        if: steps.rel.outputs.skip == 'true' && steps.rel.outputs.hub == 'true'
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.rel.outputs.out }}
        run: |
          set -euo pipefail
          DEST="curbox-${OUT}-fdroid.apk"
          gh release download "$OUT" -R "$GITHUB_REPOSITORY" --pattern "$DEST" --clobber
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "published_at=$(gh release view "$OUT" -R "$GITHUB_REPOSITORY" --json publishedAt -q .publishedAt)" >> "$GITHUB_OUTPUT"

      # Same rolling-release step as the other apps' workflows (android-apps ADR 4 and 8).
      # Only the newest build goes to the hub (see Resolve release), so its download never goes
      # backwards.
      - name: Publish to the app hub (fabiantorrestech/android-apps)
        if: steps.rel.outputs.hub == 'true'
        env:
          GH_TOKEN: ${{ secrets.APP_HUB_TOKEN }}
          SRC: ${{ steps.apk.outputs.path || steps.published.outputs.path }}
          OUT: ${{ steps.rel.outputs.out }}
          UPSTREAM_TAG: ${{ steps.rel.outputs.tag }}
          COPIED: ${{ steps.rel.outputs.skip }}
          PUBLISHED_AT: ${{ steps.published.outputs.published_at }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::APP_HUB_TOKEN is missing: the app hub was not updated."
            exit 1
          fi
          cp "$SRC" Curbox.apk
          title="$HUB_NAME $OUT"
          if [ "$COPIED" = "true" ]; then
            # Retry path: this run built nothing, it copied the APK of an existing release.
            notes="Curbox $UPSTREAM_TAG with the grayscale, Firefox and unlock waits patches. Copied from ${GITHUB_REPOSITORY} release $OUT (published $PUBLISHED_AT) on $(date -u '+%Y-%m-%d %H:%M') UTC."
          else
            notes="Built by CI from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}: Curbox $UPSTREAM_TAG with the grayscale, Firefox and unlock waits patches, on $(date -u '+%Y-%m-%d %H:%M') UTC."
          fi
          # The title is set last, so it only names this build once the APK is in place.
          if gh release view "$HUB_RELEASE" --repo "$HUB" > /dev/null 2>&1; then
            gh release upload "$HUB_RELEASE" Curbox.apk --repo "$HUB" --clobber
            gh release edit "$HUB_RELEASE" --repo "$HUB" --title "$title" --notes "$notes"
          else
            gh release create "$HUB_RELEASE" Curbox.apk --repo "$HUB" --target main --title "$title" --notes "$notes" --latest=false
          fi
